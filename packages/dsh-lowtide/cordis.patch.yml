# dsh-lowtide bundle layer.
# Applied when a profile lists dsh-lowtide among dsh.profile.bundles
# (installed via `dsh plugin --profile <name> add dsh-lowtide`).

- insert:
    - id: lowtide
      name: dsh-lowtide

# Permission presets: a row patch REPLACES the targeted row's whole config,
# so restate the dsh base table verbatim and append the lowtide presets
# (read/standard/trusted, all approval=never — night runs are unattended by
# design).
#
# ⚠️ VERSION BINDING: the three base rows below are a verbatim copy of
# `@deepseek-ai/dsh-base/cordis.patch.yml` (row id `permission`) as of
# dsh-base 0.1.1-rc.2 — re-verified identical in 0.1.5-rc.1. Because a row
# patch replaces the whole config, a future dsh-base release that ADDS a base
# preset would have it silently dropped here: after upgrading the Harness,
# diff this block against the installed `@deepseek-ai/dsh-base/cordis.patch.yml`
# and restate any new rows. (`dsh --dump-config` prints the composed tree.)
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      lt-readonly:
        sandbox: read-only
        approval: never
        name: Lowtide read-only
        description: Read-only analysis without approval prompts (lowtide).
      lt-standard:
        sandbox: workspace-write
        approval: never
        name: Lowtide standard
        description: Workspace writes without approval prompts (lowtide).
      lt-trusted:
        sandbox: danger-full-access
        approval: never
        name: Lowtide trusted
        description: Full file access without approval prompts (lowtide).
